name: CI

on:
  push:
    branches:
      - mainline
  pull_request:
    branches:
      - mainline

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Typecheck + Lint + Build
        run: npm run check:ci

      - name: Stage D.4.2 — Contract manifest drift check
        run: npm run contracts:manifest:check
